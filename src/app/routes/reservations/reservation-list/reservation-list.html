<div class="top-bar">
  <div class="page-description">
    <h1>Réservations</h1>
    <p>Rechercher et consulter les réservations</p>
  </div>
  <button mat-button type="button" routerLink="ajouter">+ Nouvelle réservation</button>
</div>
<div class="searchbar">
  <label for="site-search">Recherche</label>
  <input type="search" />
</div>
<table mat-table [dataSource]="reservationsList">
  <ng-container matColumnDef="client">
    <th mat-header-cell *matHeaderCellDef>Client</th>
    <td mat-cell *matCellDef="let reservation" class="highlight">{{ reservation.client }}</td>
  </ng-container>
  <ng-container matColumnDef="bateau">
    <th mat-header-cell *matHeaderCellDef>Bateau</th>
    <td mat-cell *matCellDef="let reservation">{{ reservation.bateau }}</td>
  </ng-container>
  <ng-container matColumnDef="debut">
    <th mat-header-cell *matHeaderCellDef>Du</th>
    <td mat-cell *matCellDef="let reservation">{{ reservation.debut }}</td>
  </ng-container>
  <ng-container matColumnDef="fin">
    <th mat-header-cell *matHeaderCellDef>Au</th>
    <td mat-cell *matCellDef="let reservation">{{ reservation.fin }}</td>
  </ng-container>
  <ng-container matColumnDef="personnes">
    <th mat-header-cell *matHeaderCellDef>Personnes</th>
    <td mat-cell *matCellDef="let reservation">{{ reservation.personnes }}</td>
  </ng-container>
  <ng-container matColumnDef="prix">
    <th mat-header-cell *matHeaderCellDef>Prix</th>
    <td mat-cell *matCellDef="let reservation">{{ reservation.prix }}</td>
  </ng-container>
  <ng-container matColumnDef="statut">
    <th mat-header-cell *matHeaderCellDef>Statut</th>
    <td mat-cell *matCellDef="let reservation">{{ reservation.statut }}</td>
  </ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>Actions</th>
    <td mat-cell *matCellDef="let reservation">
      <button
        mat-button
        (click)="onDelete(reservation)"
        class="{{ reservationToDelete == reservation ? 'second-click' : 'first-click' }}"
      >
        DELETE
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
  <tr mat-row *matRowDef="let row; columns: colonnes"></tr>
</table>
