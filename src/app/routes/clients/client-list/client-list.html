<div class="top-bar">
    <div class="page-description">
        <h1>Clients</h1>
        <p>Annuaire des clients enregistrés</p>
    </div>
    <button mat-button type="button" routerLink="ajouter">+ Ajouter un client</button>
</div>
<div class="searchbar">
    <label for="site-search">Recherche</label>
    <input type="search"/>
</div>
<table mat-table [dataSource]="clientList">
    <ng-container matColumnDef="nom" >
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let client" class="highlight"> {{client.nom}}</td>
    </ng-container>
    <ng-container matColumnDef="prenom">
        <th mat-header-cell *matHeaderCellDef>Prénom</th>
        <td mat-cell *matCellDef="let client"> {{client.prenom}}</td>
    </ng-container>
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let client"> {{client.email}} </td>
    </ng-container>
    <ng-container matColumnDef="telephone">
        <th mat-header-cell *matHeaderCellDef>Téléphone</th>
        <td mat-cell *matCellDef="let client"> {{client.telephone}}</td>
        </ng-container>

    <ng-container matColumnDef="permisBateau">
        <th mat-header-cell *matHeaderCellDef>Permis</th>
        <td mat-cell *matCellDef="let client">
            <span class="{{ client.permis ? 'permis' : '' }}">{{ client.permis ? 'Oui' : 'Non' }}
            </span>
        </td>
    </ng-container>
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let client">
            <button mat-button [routerLink]="['detail',client.id]">VIEW</button>
            <button mat-button (click)="onDelete(client)" class="{{clientToDelete == client ? 'second-click' : 'first-click'}}">DELETE</button>
        </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef="colonnes"></tr>
    <tr mat-row *matRowDef="let row; columns: colonnes"></tr>


</table>
